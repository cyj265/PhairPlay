# Release Workflow — builds a signed Android TV APK and attaches it to the
# GitHub Release for the pushed tag. Trigger with `git push origin v1.2.3`.
#
# The signing keystore never lives in the repository: it is stored as the
# KEYSTORE_BASE64 Actions secret and decoded into app/ at build time. The
# password / alias come from the matching secrets, which app/build.gradle.kts
# reads from environment variables (they win over local.properties).

name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Signed androidtv APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/phairplay-signing.jks

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testFiretvDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleFiretvRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="snapshot"; fi
          cp app/build/outputs/apk/firetv/release/app-firetv-release.apk \
             "PhairPlay-v${VERSION#v}-androidtv.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: phairplay-androidtv-apk
          path: PhairPlay-v*-androidtv.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRERELEASE=""
          case "$TAG" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" "PhairPlay-v${TAG#v}-androidtv.apk" \
            --title "PhairPlay ${TAG}" \
            --generate-notes \
            $PRERELEASE
