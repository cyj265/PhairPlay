name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  jvm-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      # The unit tests run through the Android Gradle plugin now, so the SDK has
      # to be present even though nothing is installed on a device.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run JVM unit test suite
        run: ./gradlew :app:testFiretvDebugUnitTest --stacktrace

      - name: Upload JVM test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jvm-test-report
          path: app/build/reports/tests/testFiretvDebugUnitTest/
          retention-days: 30
          if-no-files-found: ignore

  android-lint:
    name: Android lint (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googletv
            lint_task: :app:lintGoogletvDebug
          - flavor: firetv
            lint_task: :app:lintFiretvDebug

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Run Android lint
        run: ./gradlew ${{ matrix.lint_task }} --stacktrace

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/
          retention-days: 30
          if-no-files-found: ignore
