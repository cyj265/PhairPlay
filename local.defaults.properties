# Template for local.properties — copy this file and fill in the keystore.
#
# local.properties is git-ignored, so whatever you put here never reaches
# version control. The Android SDK path is optional when ANDROID_HOME is
# exported; the four keystore keys below are what app/build.gradle.kts reads.
#
#   cp local.defaults.properties local.properties
#
# KEYSTORE_FILE is resolved relative to the app module (app/), so a bare
# filename means "app/<name>.jks". Prefer an absolute path if the keystore is
# kept outside the repo.
#
# Env vars win over this file, which is handy in CI.

# Forward slashes only — a backslash in this file is read as a Properties
# escape sequence and the SDK loader then fails with "invalid drive letter".
sdk.dir=C:/Android

# Unified signing keystore — every APK built here shares one signature so any
# of them can cover-install over any other.
KEYSTORE_FILE=phairplay-signing.jks
KEYSTORE_PASSWORD=<keystore password>
KEY_ALIAS=phairplay
KEY_PASSWORD=<key password>
